  "gitpython>=3.1.40",
  "dulwich>=0.21.6",
  "netaddr>=0.10.1",
  "scapy>=2.5.0",
  "pyroute2>=0.7.12",
  "netmiko>=4.3.0",
  "schedule>=1.2.1",
  "croniter>=2.0.1",
  "python-crontab>=3.0.0",
