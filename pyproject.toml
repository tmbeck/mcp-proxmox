[project.scripts]
proxmox-mcp = "proxmox_mcp.server:main"
proxmox-mcp-control-plane = "proxmox_mcp.control_plane:main"
proxmox-mcp-release-patch = "proxmox_mcp.release:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["proxmox_mcp*"]
