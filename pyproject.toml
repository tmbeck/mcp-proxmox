[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-proxmox"
version = "0.3.0"
description = "Advanced Proxmox MCP Server (Model Context Protocol)"
readme = "README.md"
authors = [{ name = "bsahane" }]
requires-python = ">=3.10"
dependencies = [
  "mcp[cli]>=1.2.0",
  "proxmoxer>=2.0.1",
  "requests>=2.31.0",
  "python-dotenv>=1.0.1",
  "PyYAML>=6.0.1",
  "jsonschema>=4.20.0",
]
keywords = ["mcp", "proxmox", "model-context-protocol"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[dependency-groups]
dev = [
  "pytest>=7.4.3",
  "pytest-asyncio>=0.21.1",
  "black>=23.11.0",
  "flake8>=6.1.0",
  "mypy>=1.7.1",
  "ruff>=0.9.0",
]

[project.scripts]
proxmox-mcp = "proxmox_mcp.server:main"
proxmox-mcp-release-patch = "proxmox_mcp.release:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["proxmox_mcp*"]
